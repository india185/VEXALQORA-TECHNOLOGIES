[build]
  # Install dependencies if they are missing (e.g. local/CLI deploys from a fresh checkout),
  # then build with Vite.
  command = "([ -f node_modules/vite/bin/vite.js ] && [ -x node_modules/@esbuild/linux-x64/bin/esbuild ] || npm ci --no-audit --no-fund) && npm run build"
  publish = "dist"
